<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Desk 图标方案</title>
<style>
:root {
  --page: #EFECE6; --card: #FBFAF8; --line: #E2DDD5; --fg1: #1F1E1C; --fg2: #6B675F; --fg3: #8A857D;
  --dock: rgba(255,255,255,.55);
}
:root[data-theme="dark"] { --page: #151413; --card: #1F1E1C; --line: #34322E; --fg1: #EDEBE7; --fg2: #A39E96; --fg3: #837E76; --dock: rgba(40,38,35,.7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #151413; --card: #1F1E1C; --line: #34322E; --fg1: #EDEBE7; --fg2: #A39E96; --fg3: #837E76; --dock: rgba(40,38,35,.7); } }
* { box-sizing: border-box; }
body { margin: 0; padding: 32px 16px 64px; background: var(--page); color: var(--fg1); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; }
.sub { margin: 4px 0 0; color: var(--fg2); font-size: 13px; }
.seg { display: inline-flex; background: var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg1); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 20px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.card h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h2 span { font-size: 12px; font-weight: 500; color: var(--fg3); }
.card p { margin: 0; font-size: 13px; line-height: 20px; color: var(--fg2); }
.hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.hero svg.big { width: 168px; height: 168px; flex-shrink: 0; filter: drop-shadow(0 10px 18px rgba(40,30,20,.18)) drop-shadow(0 2px 4px rgba(40,30,20,.12)); }
.sizes { display: flex; gap: 18px; align-items: flex-end; }
.sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--fg3); }
.dock { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 16px; background: var(--dock); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.dock .fake { width: 44px; height: 44px; border-radius: 10px; background: var(--line); opacity: .7; }
.menu { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2); padding: 4px 10px; border-radius: 6px; background: var(--line); width: max-content; }
.pros { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 20px; color: var(--fg2); }
.rec { border-color: #C4552B; box-shadow: 0 0 0 1px #C4552B inset; }
.card h2 .tag.new { background: #3F6E9E; }
.card h2 .tag { font-size: 11px; font-weight: 600; color: #fff; background: #C4552B; border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>CC Desk 图标方案</h1>
    <p class="sub">九个方向（E–I 为新增）；配色沿用界面：米白、暖墨、陶土橙（等批准）、雾蓝（处理中）。每个方向含大图、Dock、菜单栏与 16px 小尺寸预览。</p>
  </div>
  <div class="seg" role="group" aria-label="背景">
    <button type="button" data-t="auto" aria-pressed="true">跟随系统</button>
    <button type="button" data-t="light" aria-pressed="false">浅色</button>
    <button type="button" data-t="dark" aria-pressed="false">深色</button>
  </div>
</header>

<!-- 共用的 SVG 定义 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- macOS 图标网格：824 内容区居中于 1024 画布，圆角约 185 -->
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF8F2"/><stop offset="1" stop-color="#EDE7DC"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2B27"/><stop offset="1" stop-color="#1A1816"/></linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2683F"/><stop offset="1" stop-color="#B84C25"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>

    <!-- A. cd：终端里的「换目录」 -->
    <symbol id="logoA" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
        <rect x="100" y="100" width="824" height="412" fill="url(#gloss)" opacity=".18"/>
        <text x="236" y="640" font-family="SF Mono, Menlo, monospace" font-size="330" font-weight="700" fill="#F3EEE6" letter-spacing="-8">cd</text>
        <rect x="688" y="372" width="104" height="290" rx="14" fill="url(#clay)"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".25"/>
    </symbol>

    <!-- B. 分栏书桌：左侧会话列表 + 右侧终端 -->
    <symbol id="logoB" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#cream)"/>
        <rect x="190" y="210" width="644" height="604" rx="70" fill="#FFFEFC" stroke="#DDD6CA" stroke-width="10"/>
        <path d="M190 280a70 70 0 0 1 70-70h150v604H260a70 70 0 0 1-70-70z" fill="#EDE7DC"/>
        <circle cx="262" cy="320" r="26" fill="#C4552B"/>
        <rect x="306" y="306" width="74" height="28" rx="14" fill="#B9B1A4"/>
        <circle cx="262" cy="410" r="26" fill="#3F6E9E"/>
        <rect x="306" y="396" width="74" height="28" rx="14" fill="#B9B1A4"/>
        <circle cx="262" cy="500" r="22" fill="none" stroke="#9C9488" stroke-width="10"/>
        <rect x="306" y="486" width="74" height="28" rx="14" fill="#CFC7BA"/>
        <path d="M486 400l78 64-78 64" fill="none" stroke="#2A2925" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="604" y="508" width="150" height="38" rx="19" fill="#2A2925"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".12"/>
    </symbol>

    <!-- C. 状态叠层：三张会话卡片，颜色即状态 -->
    <symbol id="logoC" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#cream)"/>
        <rect x="236" y="236" width="552" height="150" rx="56" fill="#E2DBCF"/>
        <circle cx="318" cy="311" r="30" fill="none" stroke="#9C9488" stroke-width="12"/>
        <rect x="380" y="294" width="300" height="34" rx="17" fill="#C8BFB2"/>
        <rect x="236" y="437" width="552" height="150" rx="56" fill="#3F6E9E"/>
        <circle cx="318" cy="512" r="32" fill="#E5ECF3"/>
        <rect x="380" y="495" width="300" height="34" rx="17" fill="#A9C0D8"/>
        <rect x="236" y="638" width="552" height="150" rx="56" fill="url(#clay)"/>
        <circle cx="318" cy="713" r="32" fill="#FFF4EE"/>
        <rect x="380" y="696" width="220" height="34" rx="17" fill="#F2B79D"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".12"/>
    </symbol>

    <!-- D. 提示符 + 状态点：极简 -->
    <symbol id="logoD" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
        <rect x="100" y="100" width="824" height="412" fill="url(#gloss)" opacity=".16"/>
        <path d="M300 380l150 132-150 132" fill="none" stroke="#F3EEE6" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="520" y="604" width="200" height="64" rx="32" fill="#F3EEE6"/>
        <circle cx="742" cy="330" r="58" fill="#C4552B"/>
        <circle cx="742" cy="330" r="58" fill="none" stroke="#1A1816" stroke-width="22"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".25"/>
    </symbol>

    <!-- E. 文件夹 + 提示符 -->
    <symbol id="logoE" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#cream)"/>
        <path d="M226 352a48 48 0 0 1 48-48h170a40 40 0 0 1 28 12l52 52h226a48 48 0 0 1 48 48v318a48 48 0 0 1-48 48H274a48 48 0 0 1-48-48z" fill="url(#clay)"/>
        <path d="M226 430h572v-14a48 48 0 0 0-48-48H226z" fill="#000" opacity=".08"/>
        <path d="M368 500l92 74-92 74" fill="none" stroke="#FFF7F1" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="508" y="628" width="168" height="44" rx="22" fill="#FFF7F1"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".12"/>
    </symbol>

    <!-- F. 状态灯 -->
    <symbol id="logoF" viewBox="0 0 1024 1024">
      <defs>
        <radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E2875F" stop-opacity=".55"/><stop offset="1" stop-color="#E2875F" stop-opacity="0"/></radialGradient>
      </defs>
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
        <rect x="100" y="100" width="824" height="412" fill="url(#gloss)" opacity=".14"/>
        <rect x="392" y="214" width="240" height="596" rx="120" fill="#36322D" stroke="#47423B" stroke-width="8"/>
        <circle cx="512" cy="334" r="64" fill="none" stroke="#8A857D" stroke-width="18"/>
        <circle cx="512" cy="512" r="70" fill="#4A7BAD"/>
        <circle cx="512" cy="690" r="150" fill="url(#glowC)"/>
        <circle cx="512" cy="690" r="70" fill="url(#clay)"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".25"/>
    </symbol>

    <!-- G. CC 字母 -->
    <symbol id="logoG" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#cream)"/>
        <path d="M720 316A270 270 0 1 0 720 708" fill="none" stroke="url(#clay)" stroke-width="84" stroke-linecap="round"/>
        <path d="M638 408A140 140 0 1 0 638 616" fill="none" stroke="#3F6E9E" stroke-width="72" stroke-linecap="round"/>
        <rect x="476" y="462" width="56" height="100" rx="10" fill="#2A2925"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".12"/>
    </symbol>

    <!-- H. 深色分栏窗口 -->
    <symbol id="logoH" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
        <rect x="100" y="100" width="824" height="412" fill="url(#gloss)" opacity=".14"/>
        <rect x="212" y="262" width="600" height="500" rx="64" fill="#F6F2EB"/>
        <path d="M212 326a64 64 0 0 1 64-64h96v500h-96a64 64 0 0 1-64-64z" fill="#E2DBCF"/>
        <circle cx="292" cy="360" r="30" fill="#C4552B"/>
        <circle cx="292" cy="460" r="30" fill="#3F6E9E"/>
        <circle cx="292" cy="560" r="25" fill="none" stroke="#9C9488" stroke-width="12"/>
        <path d="M450 438l84 72-84 72" fill="none" stroke="#2A2925" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="574" y="560" width="150" height="42" rx="21" fill="#2A2925"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".25"/>
    </symbol>

    <!-- I. cd + 文件夹标签 -->
    <symbol id="logoI" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
        <rect x="100" y="100" width="824" height="412" fill="url(#gloss)" opacity=".16"/>
        <path d="M232 400v-62a40 40 0 0 1 40-40h150a36 36 0 0 1 26 11l44 45h260a40 40 0 0 1 40 40v6" fill="none" stroke="url(#clay)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="228" y="700" font-family="SF Mono, Menlo, monospace" font-size="300" font-weight="700" fill="#F3EEE6" letter-spacing="-8">cd</text>
        <rect x="664" y="458" width="92" height="262" rx="12" fill="url(#clay)"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".25"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>
</div>

<script>
const OPTIONS = [
  { id: 'logoA', name: 'A · cd', tag: '推荐',
    desc: '`cd` 是终端里「进入目录」的命令，正好呼应 CC Desk 按目录组织会话；也恰好是 CC Desk 的缩写。暖墨底 + 米白等宽字 + 陶土橙光标块，光标暗示「正在运行」。',
    pros: ['一语双关，记忆点强', '16px 下仍能认出光标块', '和终端类 App 气质一致，但不撞 Terminal 图标'] },
  { id: 'logoB', name: 'B · 分栏书桌',
    desc: '直接画出 App 的样子：左边会话列表带三个状态点（橙 / 蓝 / 灰），右边终端提示符。米白底，和浅色界面一致。',
    pros: ['一眼看出 App 是做什么的', '状态色直接进图标', '缺点：细节多，16px 下会糊'] },
  { id: 'logoC', name: 'C · 状态叠层',
    desc: '三张叠放的会话卡片，从上到下：空闲、处理中、等批准。颜色就是状态语言，抽象但和界面强相关。',
    pros: ['色块大，小尺寸清楚', '状态体系的视觉延伸', '缺点：不直观体现「终端」'] },
  { id: 'logoD', name: 'D · 提示符 + 状态点',
    desc: '最简的 `>_` 提示符，右上角一个陶土橙状态点，像「有会话在等你」的通知徽标。',
    pros: ['极简、现代', '小尺寸最清楚', '缺点：终端类 App 常见，辨识度一般'] },
  { id: 'logoE', name: 'E · 文件夹提示符', tag: '新',
    desc: '陶土橙文件夹上印着 `>_`。直接讲「按目录管理终端会话」，米白底在 Dock 里很温暖。',
    pros: ['语义清楚：目录 + 终端', '橙色大面积，Dock 里醒目', '缺点：文件夹图形较常见'] },
  { id: 'logoF', name: 'F · 状态灯', tag: '新',
    desc: '暗色面板上竖排三颗灯：空闲（灰环）、处理中（雾蓝）、等批准（发光的陶土橙）。像机柜指示灯，讲的是「一眼看清所有会话状态」。',
    pros: ['状态语言最纯粹', '造型独特，不撞终端类图标', '缺点：竖排三灯可能联想到红绿灯'] },
  { id: 'logoG', name: 'G · CC 字母', tag: '新',
    desc: '两个嵌套的 C：外圈陶土橙、内圈雾蓝，中间一个光标块。字母标识 + 两种状态色，适合做品牌字标。',
    pros: ['品牌感强，可延展成字标', '两种状态色都在', '缺点：16px 下内圈会变细'] },
  { id: 'logoH', name: 'H · 深色分栏窗口', tag: '新',
    desc: 'B 方案的简化版：暗墨底上一个米白窗口，左栏三个状态点，右边大号提示符。元素少而大，小尺寸也能看清。',
    pros: ['直观 + 小尺寸可读', '深底在浅色 Dock 中对比强', '缺点：仍偏「示意图」'] },
  { id: 'logoI', name: 'I · cd + 文件夹', tag: '新',
    desc: 'A 与 E 的结合：「cd▍」上方一条陶土橙的文件夹标签轮廓，把「进入目录」这个双关画得更明确。',
    pros: ['保留 A 的记忆点', '文件夹轮廓补足语义', '缺点：比 A 多一层信息，略复杂'] },
];
const use = (id, size) => `<svg width="${size}" height="${size}" viewBox="0 0 1024 1024" role="img" aria-label="图标预览"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML = OPTIONS.map((o) => `
  <section class="card${o.tag === '推荐' ? ' rec' : ''}">
    <h2>${o.name} ${o.tag ? `<span class="tag${o.tag === '新' ? ' new' : ''}">${o.tag}</span>` : ''}</h2>
    <div class="hero">
      <svg class="big" viewBox="0 0 1024 1024" role="img" aria-label="${o.name}"><use href="#${o.id}"/></svg>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="sizes">
          <figure>${use(o.id, 64)}<figcaption>64</figcaption></figure>
          <figure>${use(o.id, 32)}<figcaption>32</figcaption></figure>
          <figure>${use(o.id, 16)}<figcaption>16</figcaption></figure>
        </div>
        <div class="dock"><span class="fake"></span>${use(o.id, 52)}<span class="fake"></span></div>
        <div class="menu">${use(o.id, 16)}<span>CC Desk</span></div>
      </div>
    </div>
    <p>${o.desc.replace(/`([^`]+)`/g, '<code>$1</code>')}</p>
    <ul class="pros">${o.pros.map((p) => `<li>${p}</li>`).join('')}</ul>
  </section>`).join('');
document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
  const v = b.dataset.t;
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  document.querySelectorAll('[data-t]').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
}));
const h = location.hash.slice(1); if (h === 'dark' || h === 'light') document.documentElement.setAttribute('data-theme', h);
</script>
</body>
</html>
