<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Desk 图标 · 质感版</title>
<style>
:root { --page: #EFECE6; --card: #FBFAF8; --line: #E2DDD5; --fg1: #1F1E1C; --fg2: #6B675F; --fg3: #8A857D; --dock: rgba(255,255,255,.5); }
:root[data-theme="dark"] { --page: #151413; --card: #1F1E1C; --line: #34322E; --fg1: #EDEBE7; --fg2: #A39E96; --fg3: #837E76; --dock: rgba(50,47,43,.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #151413; --card: #1F1E1C; --line: #34322E; --fg1: #EDEBE7; --fg2: #A39E96; --fg3: #837E76; --dock: rgba(50,47,43,.6); } }
* { box-sizing: border-box; }
body { margin: 0; padding: 32px 16px 64px; background: var(--page); color: var(--fg1); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; }
.sub { margin: 4px 0 0; color: var(--fg2); font-size: 13px; }
.seg { display: inline-flex; background: var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg1); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 20px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { margin: 0; font-size: 16px; }
.hero { display: flex; gap: 28px; align-items: center; }
.hero .side { min-width: 0; }
.hero .big { width: 200px; height: 200px; flex-shrink: 0; filter: drop-shadow(0 16px 24px rgba(30,20,10,.28)) drop-shadow(0 3px 6px rgba(30,20,10,.18)); }
.side { display: flex; flex-direction: column; gap: 16px; }
.sizes { display: flex; gap: 16px; align-items: flex-end; }
.sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--fg3); }
.sizes svg { filter: drop-shadow(0 2px 3px rgba(30,20,10,.22)); }
.dock { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 18px; background: var(--dock); border: 1px solid var(--line); width: max-content; }
.dock .fake { width: 48px; height: 48px; border-radius: 11px; background: var(--line); opacity: .7; }
.card p { margin: 0; font-size: 13px; line-height: 20px; color: var(--fg2); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>CC Desk 图标 · 质感版（基于 D）</h1>
    <p class="sub">元素只有两个：终端提示符 <code>&gt;_</code> 和一颗陶土橙指示灯（「有会话在等你」）。五种 macOS 拟物材质，避免黑色主调：米白陶瓷、陶土釉、香槟金属 + 雾蓝玻璃。</p>
  </div>
  <div class="seg" role="group" aria-label="背景">
    <button type="button" data-t="auto" aria-pressed="true">跟随系统</button>
    <button type="button" data-t="light" aria-pressed="false">浅色</button>
    <button type="button" data-t="dark" aria-pressed="false">深色</button>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <!-- 通用 -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4540"/><stop offset=".5" stop-color="#2A2724"/><stop offset="1" stop-color="#151311"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E0D0C"/><stop offset="1" stop-color="#1D1A17"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".45" stop-color="#fff" stop-opacity=".03"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="led" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#FFD2B8"/><stop offset=".28" stop-color="#F08A5D"/><stop offset=".7" stop-color="#C4552B"/><stop offset="1" stop-color="#7E3014"/></radialGradient>
    <radialGradient id="ledHalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F08A5D" stop-opacity=".75"/><stop offset=".45" stop-color="#E2734A" stop-opacity=".28"/><stop offset="1" stop-color="#E2734A" stop-opacity="0"/></radialGradient>
    <radialGradient id="ledBlue" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#C9DCF0"/><stop offset=".35" stop-color="#6B95C4"/><stop offset="1" stop-color="#2A4C72"/></radialGradient>
    <radialGradient id="ledOff" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#7A746C"/><stop offset="1" stop-color="#2E2B27"/></radialGradient>
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dy="10"/><feGaussianBlur stdDeviation="12" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="inv"/>
      <feFlood flood-color="#000" flood-opacity=".65"/><feComposite in2="inv" operator="in" result="s"/>
      <feComposite in="s" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- 陶瓷 / 键帽 -->
    <linearGradient id="ceramic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF9"/><stop offset=".6" stop-color="#F0EAE0"/><stop offset="1" stop-color="#DDD4C6"/></linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFEFB"/><stop offset="1" stop-color="#EEE7DC"/></linearGradient>
    <linearGradient id="keySide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9D0C2"/><stop offset="1" stop-color="#B9AE9E"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3631"/><stop offset="1" stop-color="#22201D"/></linearGradient>

    <!-- 指示灯（复用） -->
    <symbol id="ledOn" viewBox="-100 -100 200 200">
      <circle r="100" fill="url(#ledHalo)"/>
      <circle r="44" fill="#000" opacity=".45" cy="4"/>
      <circle r="40" fill="url(#led)"/>
      <ellipse cx="-12" cy="-16" rx="15" ry="10" fill="#fff" opacity=".7"/>
    </symbol>

    <!-- 浅色材质 -->
    <linearGradient id="champagne" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF6EE"/><stop offset=".5" stop-color="#E9E0D2"/><stop offset="1" stop-color="#CFC3B1"/></linearGradient>
    <linearGradient id="blueGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E7FB0"/><stop offset="1" stop-color="#2A4D73"/></linearGradient>
    <linearGradient id="clayGlaze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E58A5E"/><stop offset=".55" stop-color="#C95A30"/><stop offset="1" stop-color="#A9441F"/></linearGradient>
    <radialGradient id="pearl" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FFF1E4"/><stop offset="1" stop-color="#E6C9B2"/></radialGradient>
    <radialGradient id="pearlHalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6EC" stop-opacity=".9"/><stop offset=".45" stop-color="#FFE7D2" stop-opacity=".35"/><stop offset="1" stop-color="#FFE7D2" stop-opacity="0"/></radialGradient>
    <symbol id="ledPearl" viewBox="-100 -100 200 200">
      <circle r="100" fill="url(#pearlHalo)"/>
      <circle r="42" fill="#7A3418" opacity=".35" cy="5"/>
      <circle r="38" fill="url(#pearl)"/>
      <ellipse cx="-11" cy="-15" rx="13" ry="9" fill="#fff" opacity=".9"/>
    </symbol>
    <linearGradient id="glazeShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>

    <!-- V1 陶瓷 -->
    <symbol id="V1" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#ceramic)"/>
        <ellipse cx="512" cy="150" rx="440" ry="130" fill="#fff" opacity=".65" filter="url(#soft)"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g stroke="#8F8476" stroke-opacity=".45" transform="translate(0 14)" filter="url(#soft)"><path d="M300 400l140 116-140 116" stroke-width="84"/><path d="M500 640h190" stroke-width="84"/></g>
          <g stroke="#3A3631"><path d="M300 400l140 116-140 116" stroke-width="72"/><path d="M500 640h190" stroke-width="72"/></g>
          <g stroke="#fff" stroke-opacity=".25" transform="translate(0 -8)"><path d="M300 400l140 116-140 116" stroke-width="18"/><path d="M500 640h190" stroke-width="18"/></g>
        </g>
        <use href="#ledOn" x="602" y="240" width="220" height="220"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".1"/>
      <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/>
    </symbol>

    <!-- V2 陶土釉 -->
    <symbol id="V2" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#clayGlaze)"/>
        <rect x="100" y="100" width="824" height="824" fill="url(#glazeShine)" opacity=".55"/>
        <ellipse cx="420" cy="190" rx="330" ry="90" fill="#fff" opacity=".28" filter="url(#soft)"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g stroke="#6E2A10" stroke-opacity=".55" transform="translate(0 14)" filter="url(#soft)"><path d="M300 400l140 116-140 116" stroke-width="84"/><path d="M500 640h190" stroke-width="84"/></g>
          <g stroke="#FFF6EE"><path d="M300 400l140 116-140 116" stroke-width="72"/><path d="M500 640h190" stroke-width="72"/></g>
        </g>
        <use href="#ledPearl" x="606" y="244" width="210" height="210"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#5E2410" stroke-opacity=".35"/>
      <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    </symbol>

    <!-- V3 雾蓝屏 -->
    <symbol id="V3" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#champagne)"/>
        <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)" opacity=".35"/>
        <rect x="180" y="180" width="664" height="664" rx="126" fill="url(#blueGlass)"/>
        <rect x="180" y="180" width="664" height="664" rx="126" fill="#000" filter="url(#innerShadow)" opacity=".7"/>
        <g filter="url(#glowText)" fill="none" stroke="#FFF7EE" stroke-linecap="round" stroke-linejoin="round">
          <path d="M318 410l128 112-128 112" stroke-width="64"/>
          <path d="M500 640h170" stroke-width="64"/>
        </g>
        <use href="#ledOn" x="626" y="226" width="200" height="200"/>
        <rect x="180" y="180" width="664" height="664" rx="126" fill="url(#glass)"/>
        <rect x="180.5" y="180.5" width="663" height="663" rx="125.5" fill="none" stroke="#1E3550" stroke-opacity=".6" stroke-width="3"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".14"/>
      <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
    </symbol>

    <!-- V4 陶土底 + 米白键帽 -->
    <symbol id="V4" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#clayGlaze)"/>
        <rect x="100" y="100" width="824" height="824" fill="url(#glazeShine)" opacity=".45"/>
        <rect x="214" y="250" width="596" height="590" rx="120" fill="#7E3216" opacity=".35" filter="url(#soft)"/>
        <rect x="214" y="236" width="596" height="590" rx="120" fill="url(#keySide)"/>
        <rect x="244" y="214" width="536" height="540" rx="100" fill="url(#keyTop)"/>
        <rect x="244" y="214" width="536" height="540" rx="100" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="4"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g stroke="#fff" stroke-opacity=".9" transform="translate(0 5)"><path d="M352 418l104 90-104 90" stroke-width="50"/><path d="M500 598h140" stroke-width="50"/></g>
          <g stroke="#3A3631"><path d="M352 418l104 90-104 90" stroke-width="50"/><path d="M500 598h140" stroke-width="50"/></g>
        </g>
        <use href="#ledOn" x="604" y="226" width="160" height="160"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#5E2410" stroke-opacity=".35"/>
      <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
    </symbol>

    <!-- V5 雾蓝屏 + 状态灯带 -->
    <symbol id="V5" viewBox="0 0 1024 1024">
      <g clip-path="url(#sq)">
        <rect x="100" y="100" width="824" height="824" fill="url(#champagne)"/>
        <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)" opacity=".35"/>
        <rect x="180" y="180" width="664" height="556" rx="118" fill="url(#blueGlass)"/>
        <rect x="180" y="180" width="664" height="556" rx="118" fill="#000" filter="url(#innerShadow)" opacity=".7"/>
        <g filter="url(#glowText)" fill="none" stroke="#FFF7EE" stroke-linecap="round" stroke-linejoin="round">
          <path d="M318 360l124 104-124 104" stroke-width="62"/>
          <path d="M496 568h176" stroke-width="62"/>
        </g>
        <rect x="180" y="180" width="664" height="556" rx="118" fill="url(#glass)"/>
        <rect x="180.5" y="180.5" width="663" height="555" rx="117.5" fill="none" stroke="#1E3550" stroke-opacity=".6" stroke-width="3"/>
        <circle cx="412" cy="818" r="28" fill="#CFC5B6"/><circle cx="412" cy="818" r="28" fill="none" stroke="#9E9384" stroke-width="4"/>
        <circle cx="512" cy="818" r="30" fill="url(#ledBlue)"/><ellipse cx="503" cy="807" rx="10" ry="7" fill="#fff" opacity=".6"/>
        <use href="#ledOn" x="542" y="748" width="140" height="140"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000" stroke-opacity=".14"/>
      <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>
</div>
<script>
const OPTIONS = [
  { id: 'V1', name: 'V1 · 陶瓷', desc: '米白陶瓷底，深棕浮雕提示符，陶土橙指示灯像一颗嵌进去的玻璃珠。最安静、最「系统自带 App」的气质。' },
  { id: 'V2', name: 'V2 · 陶土釉', desc: '整块陶土橙釉面，米白浮雕提示符，一颗发光的珍珠白指示灯。暖色主调，Dock 里最醒目，也最有品牌感。' },
  { id: 'V3', name: 'V3 · 雾蓝屏', desc: '香槟色金属边框嵌一块雾蓝玻璃屏，米白提示符带荧光，右上角陶土橙指示灯。冷暖搭配，「一块有灯的屏幕」。' },
  { id: 'V4', name: 'V4 · 陶土底键帽', desc: '陶土橙底上一颗立体米白键帽，刻着 >_ 并嵌陶土橙指示灯——「按一下，回到等你的那个会话」。' },
  { id: 'V5', name: 'V5 · 雾蓝屏 + 状态灯带', desc: 'V3 的屏幕下方一排三颗灯：灰（空闲）、雾蓝（处理中）、陶土橙发光（等批准），把多会话状态也放进图标。' },
];
const use = (id, s) => `<svg width="${s}" height="${s}" viewBox="0 0 1024 1024" role="img" aria-label="预览"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML = OPTIONS.map((o) => `
  <section class="card">
    <h2>${o.name}</h2>
    <div class="hero">
      <svg class="big" viewBox="0 0 1024 1024" role="img" aria-label="${o.name}"><use href="#${o.id}"/></svg>
      <div class="side">
        <div class="sizes">
          <figure>${use(o.id, 64)}<figcaption>64</figcaption></figure>
          <figure>${use(o.id, 32)}<figcaption>32</figcaption></figure>
          <figure>${use(o.id, 16)}<figcaption>16</figcaption></figure>
        </div>
        <div class="dock"><span class="fake"></span>${use(o.id, 56)}<span class="fake"></span></div>
      </div>
    </div>
    <p>${o.desc.replace(/>_/g, '<code>&gt;_</code>')}</p>
  </section>`).join('');
document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => {
  const v = b.dataset.t;
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  document.querySelectorAll('[data-t]').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
}));
const h = location.hash.slice(1); if (h === 'dark' || h === 'light') document.documentElement.setAttribute('data-theme', h);
</script>
</body>
</html>
